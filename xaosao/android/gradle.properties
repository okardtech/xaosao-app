# MaxMetaspaceSize raised 512m -> 1g: AGP 9 + Gradle 9 + Kotlin 2.4 load far
# more classes than 512m holds, and `bundleRelease` (lint in particular) blew
# it up with `OutOfMemoryError: Metaspace`. Metaspace is native memory taken
# lazily, so a higher ceiling costs nothing until it is actually needed.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a SEPARATE JVM and defaults to -Xmx2g on top of
# everything above. Capped so Gradle + Kotlin + Dart fit in 8 GB of RAM.
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m

# Cap parallel workers - each one is another process holding memory, and this
# machine has 7.8 GB total.
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin 2.4.0's daemon collides on incremental-compilation storage when Gradle
# builds plugin modules in parallel ("Storage for [...] is already registered").
# Disabling IC is the workaround; plugin modules come from the pub cache and are
# served by the Gradle build cache anyway, so rebuild cost is negligible.
kotlin.incremental=false
