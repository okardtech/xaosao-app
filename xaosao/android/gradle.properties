org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin 2.4.0's daemon collides on incremental-compilation storage when Gradle
# builds plugin modules in parallel ("Storage for [...] is already registered").
# Disabling IC is the workaround; plugin modules come from the pub cache and are
# served by the Gradle build cache anyway, so rebuild cost is negligible.
kotlin.incremental=false
